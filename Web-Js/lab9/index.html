<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forms Validation</title>

    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet"
         />
</head>
<body>

    <div class="container">

        <div class="tabs">
            <button class="tab-btn active" data-tab="register">
                Register
            </button>

            <button class="tab-btn" data-tab="login">
                Login
            </button>
        </div>

        

        <form id="registerForm" class="form active-form">

            <h2>Registration Form</h2>

            <div class="form-group">
                <label>First Name</label>

                <input type="text" id="firstName">

                <small class="error"></small>
            </div>

            <div class="form-group">
                <label>Last Name</label>

                <input type="text" id="lastName">

                <small class="error"></small>
            </div>

            <div class="form-group">
                <label>Email</label>

                <input type="email" id="email">

                <small class="error"></small>
            </div>

            <div class="form-group password-group">
                <label>Password</label>

                <input type="password" id="password">

                <i class="fa-solid fa-eye toggle-password"></i>

                <small class="error"></small>
            </div>

            <div class="form-group password-group">
                <label>Confirm Password</label>

                <input type="password" id="confirmPassword">

                <i class="fa-solid fa-eye toggle-password"></i>

                <small class="error"></small>
            </div>

            <div class="form-group">
                <label>Phone</label>

                <input type="text" id="phone" placeholder="+380XXXXXXXXX">

                <small class="error"></small>
            </div>

            <div class="form-group">
                <label>Date Birth</label>

                <input type="date" id="birthDate">

                <small class="error"></small>
            </div>

            <div class="form-group">
                <label>Sex</label>

                <div class="radio-group">
                    <label>
                        <input type="radio" name="sex" value="male">
                        Male
                    </label>

                    <label>
                        <input type="radio" name="sex" value="female">
                        Female
                    </label>
                </div>

                <small class="error"></small>
            </div>

            <div class="form-group">
                <label>Country</label>

                <select id="country">
                    <option value="">Select Country</option>
                    <option value="Ukraine">Ukraine</option>
                    <option value="Poland">Poland</option>
                    <option value="Germany">Germany</option>
                </select>

                <small class="error"></small>
            </div>

            <div class="form-group">
                <label>City</label>

                <select id="city" disabled>
                    <option value="">Select City</option>
                </select>

                <small class="error"></small>
            </div>

            <button type="submit">
                Register
            </button>

        </form>

        

        <form id="loginForm" class="form">

            <h2>Login Form</h2>

            <div class="form-group">
                <label>Username</label>

                <input type="text" id="loginUsername">

                <small class="error"></small>
            </div>

            <div class="form-group password-group">
                <label>Password</label>

                <input type="password" id="loginPassword">

                <i class="fa-solid fa-eye toggle-password"></i>

                <small class="error"></small>
            </div>

            <div class="checkbox-group">
                <input type="checkbox" id="remember">

                <label for="remember">Remember Me</label>
            </div>

            <button type="submit">
                Login
            </button>

        </form>

        <div id="successMessage"></div>

    </div>

    <script src="script.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Завдання 3</title>
    <link rel="stylesheet" href="style3.css" />
</head>
<body>
    <div class="form-container">
        <h1>
            <span class="header">Заповніть форму</span>
            <span class="hover-header">Ми вдячні вам</span>
        </h1>

        <form>
            <div class="fields-grid">  
                <div class="float-left">
                    <label for="login">Login</label>
                    <input type="text" id="login" name="login" />
                </div>

                <div class="float-right">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" />
                </div>

                <div class="float-left">
                    <label for="pass">Password</label>
                    <input type="password" id="pass" name="pass" />
                </div>

                <div class="float-right">
                    <label for="pass-repeat">Repeat password</label>
                    <input type="password" id="pass-repeat" name="pass-repeat" />
                </div>

                <div class="float-left">
                    <label for="fname">First Name</label>
                    <input type="text" id="fname" name="fname" />
                </div>

                <div class="float-right">
                    <label for="lastname">Last Name</label>
                    <input type="text" id="lastname" name="lastname" />
                </div>
            </div>
            <div >
                <label for="about">About me</label>
                <textarea id="about" name="about"></textarea>
            </div>

            <div class="buttons-container">
                <button type="reset" class="button button-reset">RESET</button>
                <button type="submit" class="button button-ok">OK</button>
            </div>
        </form>
    </div>
</body>
</html>

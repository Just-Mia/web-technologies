<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style5.css" />
    <title>5</title>
</head>
<body>
    <div class="weather-widget">
        <div class="widget-main">
            <div class="arrow-navigation">
                <button style="button"> <= </button>
                <button style="button"> => </button>
            </div>
            <div class="temperature">17°</div>
        </div>
        <img src="cloud.png" alt="Хмара" class="weather-icon" />
        <div class="widget-forecast">
            <ul class="forecast-list">
                <li class="forecast-day">
                    <span class="day-ofweek">Mon</span>
                    <span class="day-temperature">17°</span>
                </li>
                <li class="forecast-day">
                    <span class="day-name">Tue</span>
                    <span class="day-temperature">19°</span>
                </li>
                <li class="forecast-day">
                    <span class="day-name">Wed</span>
                    <span class="day-temperature">16°</span>
                </li>
                <li class="forecast-day">
                    <span class="day-name">Thu</span>
                    <span class="day-temperature">18°</span>
                </li>
                <li class="forecast-day">
                    <span class="day-name">Fri</span>
                    <span class="day-temperature">21°</span>
                </li>
            </ul>
        </div>
    </div>
</body>
</html>
